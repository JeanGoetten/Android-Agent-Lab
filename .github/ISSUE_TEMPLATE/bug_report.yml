name: Bug report
description: Report a reproducible problem in Android Agent.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Android Agent. Please avoid sharing private project files, credentials, tokens, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest sequence of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, Android version, app version, or other relevant context.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add sanitized logs, screenshots, or other evidence if useful.
